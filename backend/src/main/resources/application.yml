# 12-factor configuration: every environment value comes from an environment variable so it runs both on a personal machine and on AWS
# (ECS/App Runner set the environment variables; the DB password comes from Secrets Manager - see docs/architecture/aws-deployment.md).
spring:
  modulith:
    events:
      jdbc:
        # The event publication table is created by Flyway (V21), never by Modulith (ddl-auto is validate).
        schema-initialization:
          enabled: false
      # Completed publications stay in the table (status COMPLETED) so they can be counted and inspected.
      completion-mode: update
      # After a restart, publications that were stored but not completed are delivered again (at-least-once delivery).
      republish-outstanding-events-on-restart: true
  task:
    execution:
      pool:
        # One worker: listeners run in publication order and use little memory on a 512 MiB instance.
        core-size: 1
        max-size: 1
        queue-capacity: 1000
  jackson:
    mapper:
      # Strict request types: a number where a string is expected is an error, not silently converted (the API validates its own formats).
      allow-coercion-of-scalars: false
    deserialization:
      # 4.5 where an integer is expected is an error, not 4.
      accept-float-as-int: false
  application:
    name: wander-backend
  datasource:
    url: ${WANDER_DB_URL:jdbc:postgresql://localhost:5433/wander}
    username: ${WANDER_DB_USER:wander}
    password: ${WANDER_DB_PASSWORD:wander}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is managed by Flyway; Hibernate only checks that the entities match the tables.
      ddl-auto: validate
    properties:
      hibernate:
        # Batch loading to avoid N+1 when reading items and the completion state.
        default_batch_fetch_size: 64
        jdbc:
          time_zone: UTC
  web:
    resources:
      # Default static serving is off; the UI is served in a controlled way through wander.web.dir (WebConfig).
      add-mappings: false
  flyway:
    locations: classpath:db/migration

server:
  address: ${WANDER_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8787}
  shutdown: graceful

management:
  metrics:
    distribution:
      # Histogram buckets of request durations, so Prometheus can compute p95 per route (the Grafana dashboard uses them).
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        # /actuator/prometheus is for local and compose use (docs/operations/observability.md); the free profile exposes only health.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

wander:
  security:
    # The key (pepper) of the HMAC-SHA-256 that hashes recovery codes (DR-018 B3). There is NO default value: if missing or shorter than 32 bytes the application does
    # not start. Locally: tools/dev.ps1 generates one; on AWS: Secrets Manager (RG-5). Changing the key invalidates every existing recovery code.
    recovery-pepper: ${WANDER_RECOVERY_PEPPER}
    recovery-key-version: ${WANDER_RECOVERY_KEY_VERSION:v1}
    recovery-previous-key-version: ${WANDER_RECOVERY_PREVIOUS_KEY_VERSION:}
    recovery-previous-pepper: ${WANDER_RECOVERY_PREVIOUS_PEPPER:}
  web:
    # The built UI directory. Leave empty to run the API only (for example when the UI is on S3/CloudFront).
    dir: ${WANDER_WEB_DIR:}
    # The number of trusted proxies in front of the application, used to take the caller's address from X-Forwarded-For (AD-6). 0 = ignore the header.
    # Behind CloudFront -> ALB set 2, only when the ALB accepts traffic only from CloudFront (ADR-006). Other platforms (for example Render):
    # measure first and then set the real number of proxies; a number larger than reality makes an entry sent by the client trusted (runbook section 4).
    trusted-proxy-hops: ${WANDER_TRUSTED_PROXY_HOPS:0}
  limits:
    writes-per-minute: ${WANDER_LIMIT_WRITES:120}
    identity-per-hour: ${WANDER_LIMIT_IDENTITY:30}
    recovery-per-hour: ${WANDER_LIMIT_RECOVERY:30}
    approval-per-hour: ${WANDER_LIMIT_APPROVAL:20}
    # Reading the public venue catalog (DR-008 Q-a), per minute for one address.
    catalog-per-minute: ${WANDER_LIMIT_CATALOG:120}
    # The number of approval requests (device pairing by address, asking for re-authentication by identity) per 10 minutes (DR-018 E1).
    approval-requests-per-window: ${WANDER_LIMIT_APPROVAL_REQUESTS:3}
    # A new device polling the pairing-request status (the new device polls every second), per minute for one address.
    link-poll-per-minute: ${WANDER_LIMIT_LINK_POLL:120}

logging:
  level:
    org.hibernate.SQL: ${WANDER_LOG_SQL:info}

# API contract (springdoc). Swagger UI and /v3/api-docs are served outside the "free" profile; sorted keys keep the committed backend/openapi.yaml stable.
springdoc:
  api-docs:
    version: openapi_3_1
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
