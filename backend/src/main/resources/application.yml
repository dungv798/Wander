# Cấu hình theo 12-factor: mọi giá trị môi trường lấy từ biến môi trường để chạy được cả máy cá nhân lẫn AWS
# (ECS/App Runner đặt biến môi trường; mật khẩu DB lấy từ Secrets Manager — xem docs/architecture/aws-deployment.md).
spring:
  modulith:
    events:
      jdbc:
        # The event publication table is created by Flyway (V21), never by Modulith (ddl-auto is validate).
        schema-initialization:
          enabled: false
      # Completed publications stay in the table (status COMPLETED) so they can be counted and inspected.
      completion-mode: update
      # After a restart, publications that were stored but not completed are delivered again (at-least-once delivery).
      republish-outstanding-events-on-restart: true
  task:
    execution:
      pool:
        # One worker: listeners run in publication order and use little memory on a 512 MiB instance.
        core-size: 1
        max-size: 1
        queue-capacity: 1000
  jackson:
    mapper:
      # Strict request types: a number where a string is expected is an error, not silently converted (the API validates its own formats).
      allow-coercion-of-scalars: false
    deserialization:
      # 4.5 where an integer is expected is an error, not 4.
      accept-float-as-int: false
  application:
    name: wander-backend
  datasource:
    url: ${WANDER_DB_URL:jdbc:postgresql://localhost:5433/wander}
    username: ${WANDER_DB_USER:wander}
    password: ${WANDER_DB_PASSWORD:wander}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ kiểm tra entity khớp bảng.
      ddl-auto: validate
    properties:
      hibernate:
        # Nạp theo lô để tránh N+1 khi đọc mục và trạng thái hoàn thành.
        default_batch_fetch_size: 64
        jdbc:
          time_zone: UTC
  web:
    resources:
      # Tắt phục vụ tĩnh mặc định; giao diện được phục vụ có kiểm soát qua wander.web.dir (WebConfig).
      add-mappings: false
  flyway:
    locations: classpath:db/migration

server:
  address: ${WANDER_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8787}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

wander:
  security:
    # Khóa (pepper) của HMAC-SHA-256 băm mã khôi phục (DR-018 B3). KHÔNG có giá trị mặc định: thiếu hoặc ngắn hơn 32 byte thì ứng dụng
    # không khởi động. Cục bộ: toolsdev.ps1 tự sinh; trên AWS: Secrets Manager (RG-5). Đổi khóa làm mọi mã khôi phục hiện có vô hiệu.
    recovery-pepper: ${WANDER_RECOVERY_PEPPER}
    recovery-key-version: ${WANDER_RECOVERY_KEY_VERSION:v1}
    recovery-previous-key-version: ${WANDER_RECOVERY_PREVIOUS_KEY_VERSION:}
    recovery-previous-pepper: ${WANDER_RECOVERY_PREVIOUS_PEPPER:}
  web:
    # Thư mục giao diện đã build. Để trống thì chỉ chạy API (ví dụ khi giao diện nằm trên S3/CloudFront).
    dir: ${WANDER_WEB_DIR:}
    # Số proxy tin cậy trước ứng dụng để lấy địa chỉ người gọi từ X-Forwarded-For (AD-6). 0 = bỏ qua header.
    # Sau CloudFront -> ALB đặt 2, chỉ khi ALB chỉ nhận lưu lượng từ CloudFront (ADR-006). Nền tảng khác (ví dụ Render):
    # đo trước rồi mới đặt đúng số proxy thật; số lớn hơn thực tế khiến mục do client gửi được tin (runbook §4).
    trusted-proxy-hops: ${WANDER_TRUSTED_PROXY_HOPS:0}
  limits:
    writes-per-minute: ${WANDER_LIMIT_WRITES:120}
    identity-per-hour: ${WANDER_LIMIT_IDENTITY:30}
    recovery-per-hour: ${WANDER_LIMIT_RECOVERY:30}
    approval-per-hour: ${WANDER_LIMIT_APPROVAL:20}
    # Đọc kho địa điểm công khai (DR-008 Q-a), mỗi phút cho một địa chỉ.
    catalog-per-minute: ${WANDER_LIMIT_CATALOG:120}
    # Số yêu cầu duyệt (ghép thiết bị theo địa chỉ, xin xác thực lại theo danh tính) mỗi 10 phút (DR-018 E1).
    approval-requests-per-window: ${WANDER_LIMIT_APPROVAL_REQUESTS:3}
    # Thiết bị mới hỏi trạng thái yêu cầu ghép (máy mới hỏi mỗi giây), mỗi phút cho một địa chỉ.
    link-poll-per-minute: ${WANDER_LIMIT_LINK_POLL:120}

logging:
  level:
    org.hibernate.SQL: ${WANDER_LOG_SQL:info}

# API contract (springdoc). Swagger UI and /v3/api-docs are served outside the "free" profile; sorted keys keep the committed backend/openapi.yaml stable.
springdoc:
  api-docs:
    version: openapi_3_1
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
