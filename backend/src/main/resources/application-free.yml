# Một JVM 512 MiB, một instance. Giữ mặc định local trong application.yml.
spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0
      # Neon thức dậy mất vài giây; 15 s đủ cho cold start mà không giữ tới 17 thread chờ 30 s (rà kiến trúc 08/11/2026).
      connection-timeout: 15000
  jpa:
    properties:
      # Truy vấn không bao giờ treo vô hạn trên DB chia sẻ (mili giây).
      jakarta.persistence.query.timeout: 15000
server:
  tomcat:
    threads:
      max: 20
      min-spare: 2
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/plain,image/svg+xml
# One JSON object per log line on the public deployment (Spring Boot structured logging, ECS format): the request id, route, status and
# duration of every API call are separate fields, so Render's log search can filter on them. Local runs keep readable text logs.
logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        # Metrics are not published on the public instance (the Prometheus endpoint would be reachable by anyone).
        include: health
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    # Endpoint tổng hợp /actuator/health là công khai; chỉ báo DB sẽ truy vấn Neon mỗi lần gọi và giữ DB thức (N5, rà an ninh 02/11/2026).
    db:
      enabled: false

# No API documentation endpoints on the public free-tier deployment.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
