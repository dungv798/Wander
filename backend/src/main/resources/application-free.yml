# One 512 MiB JVM, one instance. Keeps the local defaults of application.yml.
spring:
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0
      # Neon takes a few seconds to wake up; 15 s is enough for a cold start without holding up to 17 threads waiting 30 s (architecture review 08/11/2026).
      connection-timeout: 15000
  jpa:
    properties:
      # A query never hangs forever on a shared DB (milliseconds).
      jakarta.persistence.query.timeout: 15000
server:
  tomcat:
    threads:
      max: 20
      min-spare: 2
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/plain,image/svg+xml
# One JSON object per log line on the public deployment (Spring Boot structured logging, ECS format): the request id, route, status and
# duration of every API call are separate fields, so Render's log search can filter on them. Local runs keep readable text logs.
logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        # Metrics are not published on the public instance (the Prometheus endpoint would be reachable by anyone).
        include: health
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    # The aggregate endpoint /actuator/health is public; a DB indicator would query Neon on every call and keep the DB awake (N5, security review 02/11/2026).
    db:
      enabled: false

# No API documentation endpoints on the public free-tier deployment.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
