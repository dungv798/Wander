openapi: 3.1.0
info:
  description: "Trip planning API: anonymous identity and recovery, trips, days, items\
    \ and costs, sharing, and the read-only place catalog. Errors are RFC 9457 problem\
    \ details with a stable `code` member."
  title: Wander API
  version: "1.0"
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/catalog/destinations:
    get:
      operationId: searchDestinations
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
          default: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Any error: an RFC 9457 problem. Switch on the stable `code`;\
            \ `field` names the invalid input."
      security: []
      tags:
      - catalog-controller
  /api/catalog/destinations/{id}:
    get:
      operationId: getDestination
      parameters:
      - in: path
        name: id
