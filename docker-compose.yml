# Môi trường cục bộ của Wander.
#   docker compose up -d postgres            # chỉ cơ sở dữ liệu (chạy backend bằng gradlew bootRun)
#   docker compose --profile app up -d --build   # cả backend trong container (cần build jar trước)
# Mật khẩu dưới đây CHỈ dùng cho máy cá nhân. Trên AWS, mật khẩu nằm ở Secrets Manager (docs/architecture/aws-deployment.md).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wander
      POSTGRES_USER: wander
      POSTGRES_PASSWORD: wander
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wander-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wander -d wander"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: ["app"]
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WANDER_DB_URL: jdbc:postgresql://postgres:5432/wander
      WANDER_DB_USER: wander
      WANDER_DB_PASSWORD: wander
      WANDER_WEB_DIR: /web
      # Bắt buộc khi chạy backend, từ 32 byte trở lên (DR-018 B3): rỗng hoặc ngắn thì backend KHÔNG khởi động (bộ băm từ chối, lời báo
      # nêu tên biến). Cố ý không dùng ":?" vì compose nội suy cả với lệnh chỉ bật postgres. Đặt biến môi trường của shell trước khi chạy.
      WANDER_RECOVERY_PEPPER: ${WANDER_RECOVERY_PEPPER:-}
    volumes:
      - ./web/dist:/web:ro
    ports:
      - "127.0.0.1:8787:8787"

  # Local metrics stack (docs/operations/observability.md): docker compose --profile observability up -d
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      # Local only, bound to 127.0.0.1 below.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: wander
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read-only dashboards without a login (the port is bound to 127.0.0.1); editing still needs the admin account above.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  wander-pg:
