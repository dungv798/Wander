# Thử trên Safari iOS THẬT (iOS Simulator của máy macOS GitHub): cách nào tự cuộn trang lúc tải mà làm Safari thu thanh công cụ không cần người dùng vuốt?
# Chỉ chạy khi bấm "Run workflow"; không secret, không deploy, không phụ thuộc Render: tự phục vụ web/public ở localhost trên chính máy chạy.
name: ios-safari-autoscroll

on:
  workflow_dispatch:
    inputs:
      device:
        description: Tên iPhone ảo (không có thì dùng iPhone Pro mới nhất có sẵn)
        required: true
        default: iPhone 16 Pro

permissions:
  contents: read

jobs:
  safari:
    name: Safari iOS (Simulator) tự cuộn khi tải
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVICE: ${{ inputs.device }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/ios-sim
            web/public

      - name: Chọn và bật iPhone ảo
        run: |
          UDID=$(xcrun simctl list devices available -j | node tools/ios-sim/pick-device.mjs)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Phục vụ các trang thử ở localhost
        run: |
          nohup node tools/ios-sim/serve-public.mjs web/public 8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          if ! curl -sf -o /dev/null --retry 15 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:8080/autoscroll-test.html; then
            echo "Máy chủ thử không lên. Log:"; cat "$RUNNER_TEMP/server.log"; exit 1
          fi
          echo "máy chủ thử đã sẵn sàng ở http://127.0.0.1:8080"

      - name: Mở từng biến thể trong Safari và chụp ảnh
        run: |
          mkdir -p shots
          for v in f a b c d e; do
            xcrun simctl terminate "$UDID" com.apple.mobilesafari || true
            sleep 2
            xcrun simctl openurl "$UDID" "http://localhost:8080/autoscroll-test.html?v=$v"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$v.png"
            echo "đã chụp biến thể $v"
          done
          ls -la shots

      - name: Tải ảnh lên
        uses: actions/upload-artifact@v4
        with:
          name: safari-ios-autoscroll
          path: shots/*.png
          if-no-files-found: error
