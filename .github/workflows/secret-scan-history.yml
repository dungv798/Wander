# Scans the entire git history (all branches and tags) for committed secrets. The PR/push job in backend-ci scans only the working tree
# (--no-git); this one catches secrets that were committed and later deleted. Weekly plus on demand. Findings are redacted in the log.
name: secret-scan-history

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC

permissions:
  contents: read

jobs:
  history:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source=/repo --log-opts="--all" --redact --no-banner --config=/repo/.gitleaks.toml --exit-code 1
