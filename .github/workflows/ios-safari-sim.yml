# Chụp Wander trong Safari iOS THẬT chạy trong iOS Simulator (máy macOS của GitHub). Chỉ chạy khi PO bấm "Run workflow" (workflow_dispatch):
# KHÔNG tự chạy khi push/PR, không có secret, không deploy, không ghi gì vào kho. Ảnh nằm ở mục Artifacts của lượt chạy.
# Vì sao: Safari thật chỉ có trên macOS; WebKit của Playwright trên Windows không có thanh địa chỉ/công cụ của Safari.
name: ios-safari-sim

on:
  workflow_dispatch:
    inputs:
      url:
        description: Địa chỉ ứng dụng cần chụp (không có dấu / cuối)
        required: true
        default: https://wander-fx65.onrender.com
      device:
        description: Tên iPhone ảo (không có thì dùng iPhone Pro mới nhất có sẵn)
        required: true
        default: iPhone 16 Pro
      warmup_seconds:
        description: Giây chờ tối đa cho Render gói free thức dậy
        required: true
        default: "240"

permissions:
  contents: read

jobs:
  safari:
    name: Safari iOS (Simulator)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      APP_URL: ${{ inputs.url }}
      DEVICE: ${{ inputs.device }}
      WARMUP: ${{ inputs.warmup_seconds }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ios-sim

      - name: Xem runtime và máy ảo có sẵn
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -60

      - name: Chọn và bật iPhone ảo
        run: |
          UDID=$(xcrun simctl list devices available -j | node tools/ios-sim/pick-device.mjs)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Máy ảo: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID" || true

      - name: Đánh thức máy chủ Render
        # Render gói free ngủ khi vắng người: lần gọi đầu có thể mất 1-2 phút. Mỗi lần chờ tối đa 120 giây, lặp tới khi có HTTP 200 hoặc hết WARMUP.
        run: |
          start=$SECONDS
          while [ $((SECONDS - start)) -lt "$WARMUP" ]; do
            code=$(curl -s -o /dev/null -m 120 -w "%{http_code}" "$APP_URL/actuator/health/readiness" || true)
            echo "sau $((SECONDS - start))s: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done

      - name: Mở Safari và chụp ảnh
        # Mỗi ảnh khởi động lại Safari để không kẹt ở màn hình chính nếu lần trước Safari thoát (CI không có GPU nên trang bản đồ nặng có thể làm Safari thoát).
        # simctl không bấm/cuộn được; chỉ mở URL rồi chụp. Trang đo viewport không cần WebGL nên đáng tin nhất ở môi trường này.
        run: |
          mkdir -p shots
          shot() { # $1 = tên ảnh, $2 = đường dẫn trong ứng dụng, $3 = giây chờ
            xcrun simctl terminate "$UDID" com.apple.mobilesafari || true
            sleep 2
            xcrun simctl openurl "$UDID" "$APP_URL$2"
            sleep "${3:-15}"
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
            echo "đã chụp $1 ($2)"
          }
          shot 01-viewport-test "/viewport-test.html" 15
          shot 02-home "/?intro=0#/" 30
          shot 03-ha-giang "/?intro=0#/dest/ha-giang" 25
          shot 04-deck "/?intro=0#/deck/ha-giang" 25
          ls -la shots

      - name: Tải ảnh lên
        uses: actions/upload-artifact@v4
        with:
          name: safari-ios-screenshots
          path: shots/*.png
          if-no-files-found: error
